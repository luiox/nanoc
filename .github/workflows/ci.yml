name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest

      - name: Configure
        run: xmake f -p windows -a x64 -m release -y

      - name: Ensure LLVM toolchain (llc + lld-link) for the llvm backend
        shell: pwsh
        run: |
          if (-not (Get-Command llc -ErrorAction SilentlyContinue)) {
            Write-Host "llc not on PATH, installing LLVM via Chocolatey"
            choco install llvm -y
          }
          $llc = (Get-Command llc -ErrorAction SilentlyContinue).Source
          if ($llc) {
            $dir = Split-Path $llc
            "NANOC_LLVM_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "LLVM toolchain: $llc"
          } else {
            Write-Host "::warning::llc unavailable, the llvm diff column will SKIP"
          }

      - name: Build
        run: xmake -y

      - name: Run tests
        run: xmake run tests
